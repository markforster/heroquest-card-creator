site_name: HeroQuest Card Creator
site_description: Help and guidance for creating, organising, exporting, and printing HeroQuest cards
site_url: https://heroquestcards.done-well.co.uk/help/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  logo: brand/apple-touch-icon.png
  favicon: brand/favicon-96x96.png
  features:
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
    primary: black
    accent: amber

extra:
  brand_subtitle: Help

extra_css:
  - brand/hqcc-docs.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Create Your First Card: getting-started/create-your-first-card.md
      - Understand App Navigation: getting-started/understand-app-navigation.md
      - Get and Update the App: getting-started/get-and-update-the-app.md
      - Use a Downloaded Copy: getting-started/use-a-downloaded-copy.md
  - Making Cards:
      - making-cards/index.md
      - Choose a Card Template: making-cards/choose-a-card-template.md
      - Understand the Card Editing View: making-cards/understand-the-card-editing-view.md
      - Add and Position Artwork: making-cards/add-and-position-artwork.md
      - Customize Titles, Colours, and Copyright: making-cards/customize-titles-colours-and-copyright.md
      - Customize Card Back Logos and Text: making-cards/customize-card-back-logos-and-text.md
      - Template-Specific Card Controls: making-cards/understand-template-specific-card-controls.md
      - Advanced Hero and Monster Controls: making-cards/use-advanced-hero-and-monster-controls.md
      - Body Text Tools: making-cards/understand-body-text-tools.md
      - Format Card Text: making-cards/format-card-text.md
      - Insert Emoji and Dice: making-cards/insert-emoji-and-dice.md
      - Fit Body Text on a Card: making-cards/fit-body-text-on-a-card.md
      - Card States and Saving: making-cards/understand-card-states-and-saving.md
      - Save or Discard Card Changes: making-cards/save-or-discard-card-changes.md
      - Duplicate a Card: making-cards/duplicate-a-card.md
      - Understand the Pairing Tab: making-cards/understand-the-pairing-tab.md
